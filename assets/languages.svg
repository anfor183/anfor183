<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 700 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #00F5D4; }
    .badge-label { font: 600 10px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #38bdf8; }
    .lang-label { font: 600 12.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #f1f5f9; }
    .lang-sub { font: 500 11px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #94a3b8; }
    .card-border { stroke: #1e293b; stroke-width: 1; }
  </style>

  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="#0b0f19" class="card-border" />
  <rect x="0.5" y="0.5" width="494" height="3" rx="1.5" fill="url(#topGlow2)" />

  <defs>
    <linearGradient id="topGlow2" x1="0" y1="0" x2="495" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="0.5" stop-color="#00F5D4" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Header -->
  <g transform="translate(25, 32)">
    <text x="0" y="0" class="header">Most Used Languages Across Codebases</text>
    <rect x="350" y="-12" width="90" height="18" rx="4" fill="#0f766e" fill-opacity="0.25" stroke="#0d9488" stroke-width="0.8" />
    <text x="395" y="1" text-anchor="middle" class="badge-label">PRODUCTION</text>
  </g>

  <!-- Progress Bar (Total 445px width) -->
  <g transform="translate(25, 52)">
    <!-- JavaScript: 175px (39%) -->
    <rect x="0" y="0" width="175" height="9" rx="4.5" fill="#f7df1e" />
    <!-- Python: 140px (31%) -->
    <rect x="178" y="0" width="140" height="9" rx="4.5" fill="#38bdf8" />
    <!-- TypeScript: 75px (17%) -->
    <rect x="321" y="0" width="75" height="9" rx="4.5" fill="#818cf8" />
    <!-- SQL / Relational: 46px (13%) -->
    <rect x="399" y="0" width="46" height="9" rx="4.5" fill="#00f5d4" />
  </g>

  <!-- Legend 2x2 Grid -->
  <g transform="translate(25, 85)">
    <!-- JavaScript -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="6" fill="#f7df1e" />
      <text x="18" y="9" class="lang-label">JavaScript / Node.js</text>
      <text x="18" y="25" class="lang-sub">31.5 MB • Electron, Puppeteer &amp; Automation</text>
    </g>

    <!-- Python -->
    <g transform="translate(240, 0)">
      <circle cx="6" cy="6" r="6" fill="#38bdf8" />
      <text x="18" y="9" class="lang-label">Python 3.12</text>
      <text x="18" y="25" class="lang-sub">12.8 MB • FastAPI, ML Models &amp; AI Engines</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(0, 48)">
      <circle cx="6" cy="6" r="6" fill="#818cf8" />
      <text x="18" y="9" class="lang-label">TypeScript &amp; React 18</text>
      <text x="18" y="25" class="lang-sub">6.4 MB • Desktop Panels &amp; Web Dashboards</text>
    </g>

    <!-- SQL & Databases -->
    <g transform="translate(240, 48)">
      <circle cx="6" cy="6" r="6" fill="#00f5d4" />
      <text x="18" y="9" class="lang-label">SQL &amp; Relational Databases</text>
      <text x="18" y="25" class="lang-sub">4.2 MB • SQLite WAL Mode, PostgreSQL</text>
    </g>
  </g>
</svg>