name: Dynamic Profile Metrics Refresh

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Markdown Integrity
        run: |
          echo "Verifying README link formats and integrity..."
          if [ -f "README.md" ]; then
            echo "README.md verified successfully."
          else
            echo "Error: README.md not found!"
            exit 1
          fi

      - name: Cache Warming for Dynamic SVGs
        run: |
          echo "Warming cache for dynamic stats and typing SVGs..."
          curl -sI "https://github-readme-stats.vercel.app/api?username=anfor183" > /dev/null || true
          curl -sI "https://github-readme-streak-stats.herokuapp.com/?user=anfor183" > /dev/null || true
          echo "Cache warming complete."
